<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="navBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B132B"/>
      <stop offset="50%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="navPinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#23D5B2"/>
      <stop offset="45%" stop-color="#38B6DB"/>
      <stop offset="100%" stop-color="#5D9CFF"/>
    </linearGradient>
    <linearGradient id="navRingGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#23D5B2" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#5D9CFF" stop-opacity="0.3"/>
    </linearGradient>
    <filter id="navGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- App Icon Background: Rounded Tech Card -->
  <rect width="512" height="512" rx="108" fill="url(#navBgGrad)"/>
  <rect width="508" height="508" x="2" y="2" rx="106" fill="none" stroke="rgba(56, 182, 219, 0.25)" stroke-width="3"/>

  <!-- Compass / Radar Rings -->
  <circle cx="256" cy="232" r="185" fill="none" stroke="url(#navRingGrad)" stroke-width="2" stroke-dasharray="8 10" opacity="0.4"/>
  <circle cx="256" cy="232" r="140" fill="none" stroke="url(#navRingGrad)" stroke-width="2.5" opacity="0.55"/>
  <circle cx="256" cy="232" r="90" fill="none" stroke="#23D5B2" stroke-width="1.5" stroke-dasharray="4 6" opacity="0.4"/>

  <!-- Compass Crosshairs -->
  <line x1="71" y1="232" x2="441" y2="232" stroke="#38B6DB" stroke-width="1.5" stroke-dasharray="5 7" opacity="0.3"/>
  <line x1="256" y1="47" x2="256" y2="417" stroke="#38B6DB" stroke-width="1.5" stroke-dasharray="5 7" opacity="0.3"/>

  <!-- Navigation Pin Body with Glow -->
  <path d="M 256,432
           C 244,412 142,282 142,202
           C 142,139 193,88 256,88
           C 319,88 370,139 370,202
           C 370,282 268,412 256,432 Z"
        fill="url(#navPinGrad)" filter="url(#navGlow)"/>

  <!-- Dark Inner Core -->
  <circle cx="256" cy="202" r="70" fill="#0B132B"/>
  <circle cx="256" cy="202" r="70" fill="none" stroke="rgba(35, 213, 178, 0.4)" stroke-width="3"/>

  <!-- Cryptographic 'N' glyph inside Pin -->
  <path d="M 226,240 L 226,164" stroke="url(#navPinGrad)" stroke-width="12" stroke-linecap="round"/>
  <path d="M 286,240 L 286,164" stroke="url(#navPinGrad)" stroke-width="12" stroke-linecap="round"/>
  <path d="M 226,167 L 286,237" stroke="url(#navPinGrad)" stroke-width="12" stroke-linecap="round"/>

  <!-- Keyhole (Secret / ZKP Security) -->
  <circle cx="256" cy="194" r="14" fill="#0B132B"/>
  <path d="M 251,196 L 247,218 L 265,218 L 261,196 Z" fill="#0B132B"/>
  <circle cx="256" cy="194" r="5" fill="#23D5B2"/>
</svg>
